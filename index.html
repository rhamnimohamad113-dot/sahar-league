<style>

.tips{display:grid;gap:8px;margin:0 0 14px}.tips div{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,rgba(124,139,255,.18),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:9px 12px;font-size:13.5px}.tips img{width:30px;height:30px;flex:none}.tips.sm div{font-size:12.5px}
.bd{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}.bd div{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:10px;text-align:center}.bd img{width:36px;height:36px}.bd b{display:block;font-size:18px;color:var(--gold)}.bd span{font-size:11.5px;color:var(--mu)}.bd .bdt{background:linear-gradient(135deg,rgba(255,215,106,.3),rgba(255,143,184,.2));border-color:rgba(255,215,106,.55);display:flex;flex-direction:column;justify-content:center}.bd .bdt b{font-size:28px;color:#fff}
.stc{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:14px}.bars{display:flex;align-items:flex-end;gap:5px;height:110px;direction:ltr}.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.bc i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#FFD76A,#7C8BFF)}.bc span{font-size:10px;color:var(--mu);margin-top:3px}.stt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}.stt b{display:block;font-size:16px}.stt b.up{color:#6CF0B0}.stt b.dn{color:#FF93A8}.stt small{font-size:11px;color:var(--mu)}

<script>const LG_ST={"astronaut":"st/astronaut.png","rocket":"st/rocket.png","trophy":"st/trophy.png","fire":"st/fire.png","crown":"st/crown.png","sunrise":"st/sunrise.png","sun":"st/sun.png","star":"st/star.png","glow":"st/glow.png","target":"st/target.png","bolt":"st/bolt.png","m1":"st/m1.png","m2":"st/m2.png","m3":"st/m3.png","alarm":"st/alarm.png","earth":"st/earth.png","moon":"st/moon.png","planet":"st/planet.png","ufo":"st/ufo.png","satellite":"st/satellite.png","shooting":"st/shooting.png","hundred":"st/hundred.png","party":"st/party.png","sparkles":"st/sparkles.png","muscle":"st/muscle.png","rooster":"st/rooster.png","sleep":"st/sleep.png","chart":"st/chart.png","medal":"st/medal.png","books":"st/books.png","clap":"st/clap.png","gem":"st/gem.png","cool":"st/cool.png"},LG_SUITS=["#6C7CFF","#FFB02E","#2FC6A0","#FF6B9A","#9B7BFF","#FF8A4C","#2DB4E8"],LG_VISOR=["#2B2170","#1B3A78","#3A1F6B","#17476A"],LG_BADGE={"crown":"crown","flame":"fire","sun":"sunrise","rocket":"rocket","star":"glow","target":"target","bolt":"muscle","m1":"m1","m2":"m2","m3":"m3"},LG_AV=["rocket","planet","ufo","satellite","moon","earth","shooting","gem","rooster","sun","glow","cool"],LG_AVBG=[["#E8ECFF","#C9D2FF"],["#FFF1D6","#FFD99A"],["#DDF7EE","#A9E9D2"],["#FFE3EC","#FFB9CF"],["#EDE6FF","#CDBDFF"],["#E0F3FF","#A8DBFF"]];const lgHash=(s)=>{ let h = 7; String(s).split('').forEach(c=>{ h = (h * 31 + c.charCodeAt(0)) >>> 0; }); return h; };
function lgMix(hex, t){ const n = parseInt(String(hex).replace('#', ''), 16), f = (v)=>Math.max(0, Math.min(255, Math.round(t >= 0 ? v + (255 - v) * t : v * (1 + t)))); const r = f(n >> 16), g = f((n >> 8) & 255), b = f(n & 255); return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); }
function lgSticker(id){ return ''; }

function lgCartoon(o){
  o = o || {}; const pose = o.pose || 'wave', K = '#1F1D3D', W = 3.4, ac = o.acc || '#4C8DF6', id = 'c' + Math.random().toString(36).slice(2, 7), moon = o.planet === 'moon', sz = o.size || 220, noPlanet = o.planet === 'none';
  const tube = (d)=>`<path d="${d}" fill="none" stroke="${K}" stroke-width="${18 + W * 2}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>`;

  if(r.absN)out.push(['sleep',`تا حالا ${fa(r.absN)} آزمونک غایب بوده‌ای`+((P().absent||0)?` (هر غیبت ${fa(P().absent)}- امتیاز)`:'')]);
  if(r.weeks)out.push(['trophy',`${fa(r.weeks)} هفته‌ی کامل! هر هفته‌ی کامل ${fa(P().weekFull||0)} امتیاز پاداش`]);
  const ds=dz(r),qs=ds.reduce((a,d)=>a+qnOf(d),0),cs=ds.reduce((a,d)=>a+d.c,0);if(qs)out.push(['target',`دقتت ${fa(Math.round(cs/qs*100))}٪ است (${fa(cs)} پاسخ درست از ${fa(qs)})`]);
  return out;
}

function chBar(vals,avg,o){o=o||{};const w=520,h=150,pl=8,pr=8,pt=14,pb=22,n=vals.length;if(!n)return'';const all=vals.concat(avg||[]).filter(v=>v!=null),mx=Math.max(1,...all),bw=(w-pl-pr)/n,Y=v=>pt+(1-v/mx)*(h-pt-pb);

  <div class="aw">${(D.awards||[]).map(a=>`<div class="awc">${lgBadge(a.kind,42)}<div><span>${E(a.title)}</span><b>${E(a.name)}</b><em>${E(a.text)}</em></div></div>`).join('')}</div>
  ${tab=='total'?`<div class="pod">${pod}</div>`:''}
  <div class="tabs">${[['total','🏆 لیگ'],['today','📅 امروز'],['early','🌅 سحرخیزها'],['streak','🔥 پیوستگی']].map(t=>`<button class="${tab==t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>
  ${list.length?list.map((r,i)=>`<div class="row ${tab=='total'&&r.rank<4?'t'+r.rank:''} ${m&&m.i==r.i?'me1':''}" onclick="openS(${r.i})"><div class="rk">${tab=='total'&&r.rank<=3?lgBadge('m'+r.rank,36,fa(r.rank)):fa(tab=='total'?r.rank:i+1)}</div>${lgAvatar(r.name+r.i,44)}<div class="nm"><b>${E(r.name)}</b><small>${sub(r)}${r.streak>=2&&tab!='streak'?` <span class="fl">🔥${fa(r.streak)}</span>`:''} <span class="acn">🏅${fa(achOf(r).filter(a=>a.ok).length)}</span></small></div><div class="pt"><b>${val(r)}</b><small>${lab}</small></div>${tab=='total'?arrow(r):''}</div>`).join(''):'<div class="empty">برای این بخش هنوز اطلاعاتی نیست.</div>'}
  ${statsHtml()}
  ${(()=>{const W=weekly();return W.length?`<h2 class="h2">قهرمانان هفته</h2><div class="wk">${W.map(w=>`<div class="wkc" onclick="openS(${w.s.i})">${lgAvatar(w.s.name+w.s.i,46)}<div><span>هفته‌ی ${fa(w.n)} (${E(w.from)} تا ${E(w.to)})</span><b>${E(w.s.name)}</b><em>${fa(w.t)} امتیاز</em></div><img src="${LG_ST.trophy}" alt=""></div>`).join('')}</div>`:''})()}
  <h2 class="h2">سفر سطح‌ها</h2>${journey(m?lvIndex(m):-1)}
  <div class="rules"><h3>امتیازها چطور حساب می‌شود؟</h3><ul style="margin:0;padding-inline-start:18px">${(D.rules||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ul></div>
  <div class="foot">هر روز بعد از پایان آزمونک به‌روز می‌شود 🚀 — آزمونک ساعت ۵ تا ۱۰ صبح</div>`;
  const fi=$('#fi');fi.oninput=()=>{const v=fi.value.trim();if(v.length<2){$('#sg').innerHTML='';return}const r=S.filter(s=>s.name.includes(v)).slice(0,6);$('#sg').innerHTML=r.length?`<div class="sug">${r.map(s=>`<button onclick="pick(${s.i})">${lgAvatar(s.name+s.i,30)}<span>${E(s.name)}</span><small style="margin-inline-start:auto;color:#B9C0FF">رتبه ${fa(s.rank)}</small></button>`).join('')}</div>`:''}
}
window.setTab=t=>{tab=t;view()};
window.pick=i=>{me=String(i);try{localStorage.setItem('lgme',me)}catch(e){}view();window.scrollTo({top:0,behavior:'smooth'})};
window.closeS=()=>{const m=$('.mbg');if(m)m.remove();try{if(/^#s\d+/.test(location.hash))history.replaceState(null,'',location.pathname+location.search)}catch(e){}};
window.openS=i=>{const r=(D.students||[]).find(s=>s.i==i);if(!r)return;closeS();
  const days=(r.days||[]).map((d,k)=>d&&d.ab?`<div class="dd"><b>آزمونک ${fa(D.dayList[k].num)}</b><span style="color:#FF93A8">غایب</span><b style="color:#FF93A8">${d.tot?fa(d.tot):'—'}</b></div>`:d?`<div class="dd"><b>آزمونک ${fa(D.dayList[k].num)}</b><span>${fa(d.c)} درست — ${fa(d.w)} غلط — شروع ${hm(d.m)}</span><b style="color:#FFD76A">${d.tot>0?'+':''}${fa(d.tot)}</b></div>`:`<div class="dd"><b>آزمونک ${fa(D.dayList[k].num)}</b><span>شرکت نکرد</span><b>—</b></div>`).reverse().join('');
  const el=document.createElement('div');el.className='mbg';el.onclick=e=>{if(e.target==el)closeS()};
  el.innerHTML=`<div class="md"><div class="mh">${lgAstro({pose:pose(r),size:112,acc:['#6C7CFF','#FFB02E','#2FC6A0','#FF6B9A','#9B7BFF'][r.i%5]})}<div><h2>${E(r.name)}</h2><div style="color:#B9C0FF;font-size:13px">${E(r.title)}</div><div style="margin-top:6px">${arrow(r)}</div></div><button class="x" onclick="closeS()">✕</button></div>
  <div class="g3"><div><b>${fa(r.rank)}</b><small>رتبه</small></div><div><b>${fa(r.total)}</b><small>امتیاز کل</small></div><div><b>${fa(r.streak)}</b><small>روز پیوسته</small></div><div><b>${fa(r.parts)}/${fa(D.n)}</b><small>شرکت</small></div><div><b>${fa(r.best)}</b><small>بهترین رشته</small></div><div><b>${hm(r.avgStart)}</b><small>میانگین شروع</small></div></div>
  <div style="color:#B9C0FF;font-size:13px">سطح: <b style="color:#fff">${E(r.level)}</b>${r.lvlNext?' — '+fa(Math.max(0,r.lvlNext.at-r.total))+' امتیاز تا «'+E(r.lvlNext.name)+'»':' — بالاترین سطح 🎉'}</div><div class="bar"><i style="width:${r.lvlPct}%"></i></div>
  ${(r.badges||[]).length?`<div class="bds">${r.badges.map(b=>`<span>${lgBadge(b[0],26)}${E(b[1])}</span>`).join('')}</div>`:''}
  <div class="tips sm">${tips(r).map(t=>`<div><img src="${LG_ST[t[0]]}" alt=""><span>${t[1]}</span></div>`).join('')}</div>
  <div style="margin:14px 0 6px;color:#B9C0FF;font-size:13px">نشان‌ها (${fa(achOf(r).filter(a=>a.ok).length)} از ${fa(ACH.length)})</div><div class="ach sm">${achOf(r).map(a=>`<div class="ac ${a.ok?'':'lk'}"><img src="${LG_ST[a.ic]}" alt=""><b>${E(a.t)}</b><span>${E(a.d)}</span></div>`).join('')}</div>
  ${analysis(r)}
  <div style="margin:14px 0 4px;color:#B9C0FF;font-size:13px">ریز آزمونک‌ها</div><div>${days}</div>
  <button class="shr" onclick="shareS(${r.i})">🔗 لینک صفحه‌ی من</button></div>`;
  document.body.appendChild(el);try{history.replaceState(null,'','#s'+r.i)}catch(e){}};
window.shareS=i=>{const u=location.href.split('#')[0]+'#s'+i;try{navigator.clipboard.writeText(u);alertish('لینک کپی شد؛ ذخیره‌اش کن تا هر روز مستقیم صفحه‌ی خودت باز شود')}catch(e){prompt('لینک صفحه‌ی تو',u)}};
function alertish(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function hashOpen(){const m=/^#s(\d+)/.exec(location.hash);if(m&&(D.students||[]).some(s=>String(s.i)===m[1])){if(!me){me=m[1];try{localStorage.setItem('lgme',me)}catch(e){}}view();openS(+m[1])}}
function boot(){view();hashOpen();fetch('league-data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.students){D=j;view();hashOpen()}}).catch(()=>{})}
boot();
})();
</script></body></html>
