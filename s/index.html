<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#121F4A">
<title>گزارش خصوصی</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5FA;--card:#fff;--ink:#16213E;--mut:#6B7590;--line:#E6E9F2;--acc:#5B72E8;--good:#2F9E62;--warn:#D19A2A;--bad:#D3483C;--hero1:#0B1330;--hero2:#1B2D66}
@media (prefers-color-scheme:dark){:root{--bg:#0E1424;--card:#172038;--ink:#E8ECF7;--mut:#98A2BD;--line:#26304C;--acc:#8094FF}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14.5px;line-height:1.8;-webkit-text-size-adjust:100%}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;padding:22px 16px 46px}
.hero .w{max-width:980px;margin:0 auto}.hero small{opacity:.75;font-size:12px}.hero h1{margin:4px 0 2px;font-size:22px;font-weight:800;line-height:1.5}.hero p{margin:0;opacity:.85;font-size:13px}
main{max-width:980px;margin:-30px auto 40px;padding:0 12px;display:grid;gap:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;box-shadow:0 6px 22px rgba(20,30,70,.06);min-width:0}
.c h2{margin:0 0 8px;font-size:15px;font-weight:800;display:flex;gap:8px;align-items:center}.c h2 span{font-weight:400;color:var(--mut);font-size:12px;margin-inline-start:auto}
.ks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.k{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:linear-gradient(180deg,rgba(91,114,232,.05),transparent)}
.k b{display:block;font-size:21px;font-weight:800;line-height:1.3}.k span{color:var(--mut);font-size:12px}.k.good b{color:var(--good)}.k.warn b{color:var(--warn)}.k.bad b{color:var(--bad)}
.l{display:grid;gap:6px}.li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;flex-wrap:wrap}
.li b{font-weight:600}.li .s{color:var(--mut);font-size:12.5px}.tag{margin-inline-start:auto;font-size:12px;padding:2px 10px;border-radius:99px;background:rgba(91,114,232,.12);color:var(--acc);white-space:nowrap}
.tag.bad{background:rgba(211,72,60,.12);color:var(--bad)}.tag.warn{background:rgba(209,154,42,.15);color:var(--warn)}.tag.good{background:rgba(47,158,98,.12);color:var(--good)}
.dots{display:grid;gap:4px}.dr{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px;align-items:center;font-size:13px}.dr .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd{direction:ltr;display:grid;grid-template-columns:repeat(14,1fr);gap:3px}.dd i{display:block;height:16px;border-radius:4px;background:var(--line)}.dr em{font-style:normal;color:var(--mut);font-size:12px;white-space:nowrap}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
svg{display:block;width:100%;height:auto;overflow:visible}svg text{font-family:inherit;fill:var(--mut);font-size:10px}
.tx{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:10px 12px;border:1px dashed var(--line);font-size:13.5px}
.cp{font-family:inherit;border:0;background:var(--acc);color:#fff;border-radius:10px;padding:5px 14px;cursor:pointer;font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--mut);font-weight:600}
.tw{overflow-x:auto}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:720px){.g2{grid-template-columns:1fr}.dr{grid-template-columns:90px 1fr auto}}
.msg{max-width:520px;margin:60px auto;text-align:center;padding:0 16px;color:var(--mut)}.msg b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.ft{text-align:center;color:var(--mut);font-size:11.5px;margin:8px 0 30px}
details summary{cursor:pointer;font-weight:600}.more{margin-top:6px}.more>summary{color:var(--acc);font-size:13px}.li .s{flex:1 1 auto}
</style>
</head>
<body>
<div id="app"><div class="msg"><b>⏳ در حال باز کردن گزارش…</b>این صفحه رمزگذاری شده و فقط با لینک کامل باز می‌شود.</div></div>
<script>
(function(){
var ST = {'نرمال':'#2F9E62','موجه':'#64B5F6','نوسانی':'#E2A33B','بحرانی':'#D3483C','تعلیق':'#7B6FD0','غایب':'#9AA1B5'};
var FA = function(n){ return String(n).replace(/\d/g, function(d){ return '۰۱۲۳۴۵۶۷۸۹'[d]; }); };
var E = function(s){ return FA(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var app = document.getElementById('app');
function fail(t, d){ app.innerHTML = '<div class="msg"><b>' + E(t) + '</b>' + E(d || '') + '</div>'; }
function b64(s){ s = s.replace(/-/g, '+').replace(/_/g, '/'); while(s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for(var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function VW(){ var w = Math.min(document.documentElement.clientWidth || 640, 980); return w < 560 ? Math.max(300, w - 40) : (w < 760 ? w - 60 : 640); }
function line(o){
  var W = VW(), H = o.h || 190, P = {l: 8, r: 30, t: 12, b: 26}, n = o.labels.length, mx = o.max || 0;
  o.series.forEach(function(s){ s.values.forEach(function(v){ if(v != null && v > mx) mx = v; }); }); if(!mx) mx = 1;
  var X = function(i){ return P.l + (n < 2 ? 0 : i * (W - P.l - P.r) / (n - 1)); }, Y = function(v){ return P.t + (1 - v / mx) * (H - P.t - P.b); };
  var g = '';
  [0, .5, 1].forEach(function(f){ var y = Y(mx * f); g += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y + '" y2="' + y + '" stroke="currentColor" opacity=".12"/>' + (f ? '<text x="' + (W - P.r + 4) + '" y="' + (y + 3) + '" text-anchor="start">' + FA(Math.round(mx * f)) + (o.unit || '') + '</text>' : ''); });
  var step = Math.ceil(n / 7); o.labels.forEach(function(l, i){ if(i % step && i !== n - 1) return; g += '<text x="' + X(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + E(l) + '</text>'; });
  o.series.forEach(function(s){ var d = '', a = ''; s.values.forEach(function(v, i){ if(v == null) return; d += (d ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); });
    if(s.area !== false){ var pts = []; s.values.forEach(function(v, i){ if(v != null) pts.push([X(i), Y(v)]); }); if(pts.length > 1) a = '<path d="M' + pts[0][0] + ' ' + Y(0) + pts.map(function(p){ return 'L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join('') + 'L' + pts[pts.length - 1][0] + ' ' + Y(0) + 'Z" fill="' + s.color + '" opacity=".12"/>'; }
    g += a + '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    s.values.forEach(function(v, i){ if(v != null) g += '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="3" fill="' + s.color + '"><title>' + E(o.labels[i]) + ': ' + FA(v) + (o.unit || '') + '</title></circle>'; }); });
  var leg = o.series.length > 1 ? '<div class="leg">' + o.series.map(function(s){ return '<span><i style="background:' + s.color + '"></i>' + E(s.name) + '</span>'; }).join('') + '</div>' : '';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="color:var(--ink)">' + g + '</svg>' + leg;
}
function bars(o){
  var W = VW(), H = o.h || 180, P = {l: 6, r: 30, t: 14, b: 26}, n = o.values.length, mx = o.max || Math.max.apply(null, o.values.concat([1]));
  var bw = (W - P.l - P.r) / n, g = '';
  [0, .5, 1].forEach(function(f){ var y = P.t + (1 - f) * (H - P.t - P.b); g += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y + '" y2="' + y + '" stroke="currentColor" opacity=".12"/>' + (f ? '<text x="' + (W - P.r + 4) + '" y="' + (y + 3) + '">' + FA(Math.round(mx * f * 10) / 10) + (o.unit || '') + '</text>' : ''); });
  var step = Math.ceil(n / 8);
  o.values.forEach(function(v, i){ var h = Math.max(0, v || 0) / mx * (H - P.t - P.b), x = P.l + i * bw + bw * .18, y = H - P.b - h, c = (o.colors && o.colors[i]) || o.color || '#5B72E8';
    g += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (bw * .64).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="4" fill="' + c + '"><title>' + E(o.labels[i]) + ': ' + FA(v) + (o.unit || '') + '</title></rect>';
    if(o.labelsOn && v) g += '<text x="' + (x + bw * .32) + '" y="' + (y - 3) + '" text-anchor="middle">' + FA(v) + '</text>';
    if(!(i % step) || i === n - 1) g += '<text x="' + (x + bw * .32) + '" y="' + (H - 6) + '" text-anchor="middle">' + E(o.labels[i]) + '</text>'; });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="color:var(--ink)">' + g + '</svg>';
}
function sec(x){
  var h = x.title ? '<h2>' + E(x.title) + (x.sub ? '<span>' + E(x.sub) + '</span>' : '') + '</h2>' : '', b = '';
  if(x.t === 'kpis') b = '<div class="ks">' + x.items.map(function(k){ return '<div class="k ' + (k.c || '') + '"><b>' + E(k.v) + '</b><span>' + E(k.l) + '</span></div>'; }).join('') + '</div>';
  else if(x.t === 'line') b = line(x);
  else if(x.t === 'bars') b = bars(x);
  else if(x.t === 'list'){ var li = function(i){ return '<div class="li"><b>' + E(i.a) + '</b>' + (i.b ? '<span class="s">' + E(i.b) + '</span>' : '') + (i.tag ? '<span class="tag ' + (i.c || '') + '">' + E(i.tag) + '</span>' : '') + '</div>'; }, N = x.max || 6;
    b = x.items.length ? '<div class="l">' + x.items.slice(0, N).map(li).join('') + '</div>' + (x.items.length > N ? '<details class="more"><summary>' + E(x.items.length - N) + ' مورد دیگر</summary><div class="l" style="margin-top:6px">' + x.items.slice(N).map(li).join('') + '</div></details>' : '') : '<div class="s" style="color:var(--mut)">' + E(x.empty || 'موردی نیست 👌') + '</div>'; }
  else if(x.t === 'dots') b = '<div class="dots">' + x.rows.map(function(r){ return '<div class="dr"><span class="n">' + E(r.name) + '</span><div class="dd">' + r.d.map(function(v, i){ return '<i style="background:' + (ST[v] || 'var(--line)') + '" title="' + E((x.days || [])[i] || '') + ' — ' + E(v || 'ثبت نشده') + '"></i>'; }).join('') + '</div><em>' + E(r.tag || '') + '</em></div>'; }).join('') + '</div><div class="leg">' + Object.keys(ST).slice(0, 5).map(function(k){ return '<span><i style="background:' + ST[k] + '"></i>' + k + '</span>'; }).join('') + '</div>';
  else if(x.t === 'text') b = '<div class="tx">' + E(x.text) + '</div>' + (x.copy ? '<div style="text-align:left;margin-top:6px"><button class="cp">کپی متن</button></div>' : '');
  else if(x.t === 'table') b = '<div class="tw"><table><tr>' + x.head.map(function(c){ return '<th>' + E(c) + '</th>'; }).join('') + '</tr>' + x.rows.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>' + E(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
  else if(x.t === 'texts') b = '<div class="l">' + x.items.map(function(i){ return '<details class="li" style="display:block"><summary>' + E(i.a) + (i.tag ? ' <span class="tag ' + (i.c || '') + '">' + E(i.tag) + '</span>' : '') + '</summary><div class="tx" style="margin-top:6px">' + E(i.text) + '</div><div style="text-align:left;margin-top:6px"><button class="cp">کپی</button></div></details>'; }).join('') + '</div>';
  return '<section class="c' + (x.wide === false ? '' : '') + '">' + h + b + '</section>';
}
function render(d){
  document.title = d.title || 'گزارش';
  var html = '<div class="hero"><div class="w"><small>' + E(d.kind || '') + '</small><h1>' + E(d.title) + '</h1><p>' + E(d.sub || '') + '</p></div></div><main>';
  var S = d.sections || [], i = 0;
  while(i < S.length){ if(S[i].half && S[i + 1] && S[i + 1].half){ html += '<div class="g2">' + sec(S[i]) + sec(S[i + 1]) + '</div>'; i += 2; } else { html += sec(S[i]); i++; } }
  html += '</main><div class="ft">به‌روزرسانی: ' + E(d.gen || '') + ' · این صفحه رمزگذاری شده و فقط با همین لینک باز می‌شود؛ لینک را برای کسی جز صاحبش نفرست.</div>';
  app.innerHTML = html;
  app.querySelectorAll('.cp').forEach(function(b){ b.addEventListener('click', function(){ var t = b.closest('section, details').querySelector('.tx'); if(t && navigator.clipboard) navigator.clipboard.writeText(t.textContent).then(function(){ b.textContent = '✓ کپی شد'; setTimeout(function(){ b.textContent = 'کپی'; }, 1500); }); }); });
}
var h = (location.hash || '').slice(1).split('.');
if(h.length !== 2 || !/^[a-f0-9]{12,40}$/.test(h[0]) || h[1].length < 20){ fail('لینک ناقص است', 'لینک را کامل (همراه با بخش بعد از #) باز کن.'); return; }
if(!window.crypto || !crypto.subtle){ fail('مرورگر پشتیبانی نمی‌کند', 'این صفحه را با کروم، سافاری یا فایرفاکسِ به‌روز باز کن.'); return; }
history.replaceState(null, '', location.pathname + location.search + '#' + h[0] + '.' + h[1]);
fetch('d/' + h[0] + '.json?t=' + Date.now(), {cache: 'no-store'}).then(function(r){ if(!r.ok) throw new Error(r.status === 404 ? 'gone' : 'net'); return r.json(); }).then(function(j){
  return crypto.subtle.importKey('raw', b64(h[1]), 'AES-GCM', false, ['decrypt']).then(function(k){ return crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(j.iv)}, k, b64(j.ct)); });
}).then(function(buf){ render(JSON.parse(new TextDecoder().decode(buf))); }).catch(function(e){
  if(e && e.message === 'gone') fail('این لینک دیگر فعال نیست', 'لینک باطل شده یا هنوز منتشر نشده؛ لینک تازه را از مسئولش بگیر.');
  else if(e && e.message === 'net') fail('اتصال برقرار نشد', 'چند لحظه بعد دوباره امتحان کن.');
  else fail('این لینک باز نشد', 'کلید لینک درست نیست یا لینک عوض شده است.');
});
})();
</script>
</body>
</html>
